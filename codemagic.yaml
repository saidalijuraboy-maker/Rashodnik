workflows:
  rashodnik-ios:
    name: Rashodnik iOS
    max_build_duration: 60

    environment:
      node: 22.14.0

    scripts:
      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p "$HOME/pnpm-bin"
          npm install --prefix "$HOME/pnpm-bin" pnpm@10.26.1
          "$HOME/pnpm-bin/node_modules/.bin/pnpm" install --frozen-lockfile
      
      - name: Check Expo authentication
        script: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is available"
          else
            echo "EXPO_TOKEN is NOT available"
            exit 1
          fi

      - name: Build iOS with EAS
        script: |
          cd "$CM_BUILD_DIR/artifacts/rashodnik"
          npx eas-cli build --platform ios --profile production --non-interactive

    artifacts:
      - artifacts/rashodnik/**/*.ipa
