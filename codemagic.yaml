workflows:
  rashodnik-ios:
    name: Rashodnik iOS
    max_build_duration: 60

    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pnpm-store

    scripts:
      - name: Check pnpm
        script: |
          cd "$CM_BUILD_DIR"
          export COREPACK_ENABLE_PROJECT_SPEC=0
          pnpm --version

      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR"
          export COREPACK_ENABLE_PROJECT_SPEC=0
          pnpm install --frozen-lockfile

      - name: Generate iOS project
        script: |
          cd "$CM_BUILD_DIR/artifacts/rashodnik"
          export COREPACK_ENABLE_PROJECT_SPEC=0
          pnpm exec expo prebuild --platform ios --no-install
          test -d ios

    artifacts:
      - artifacts/rashodnik/ios/**/*.xcworkspace
      - artifacts/rashodnik/ios/**/*.xcodeproj
