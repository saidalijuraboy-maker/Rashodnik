workflows:
  rashodnik-ios:
    name: Rashodnik iOS
    max_build_duration: 60

    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install standalone pnpm
        script: |
          mkdir -p "$HOME/pnpm-bin"
          npm install --prefix "$HOME/pnpm-bin" pnpm@10.26.1
          "$HOME/pnpm-bin/node_modules/.bin/pnpm" --version

      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR"
          "$HOME/pnpm-bin/node_modules/.bin/pnpm" install --frozen-lockfile

      - name: Generate iOS project
        script: |
          cd "$CM_BUILD_DIR/artifacts/rashodnik"
          "$HOME/pnpm-bin/node_modules/.bin/pnpm" exec expo prebuild --platform ios --no-install
          test -d ios

    artifacts:
      - artifacts/rashodnik/ios/**/*.xcworkspace
      - artifacts/rashodnik/ios/**/*.xcodeproj
