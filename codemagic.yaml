workflows:
  ios-release:
    name: Расходник — IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Rashodnik.xcodeproj"
        XCODE_SCHEME: "Rashodnik"
        BUNDLE_ID: "com.rashodnik.app"
    scripts:
      - name: Сборка архива (без подписи)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Rashodnik.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Упаковка IPA
        script: |
          mkdir -p build/Payload
          cp -R build/Rashodnik.xcarchive/Products/Applications/Rashodnik.app build/Payload/
          cd build && zip -qry Rashodnik.ipa Payload
    artifacts:
      - build/*.ipa
      - build/Rashodnik.xcarchive

# Для подписанной сборки (установка на устройство, TestFlight):
#   1. Загрузите сертификат и provisioning profile в Codemagic
#   2. Замените шаг сборки на keychain initialize + app-store-connect fetch-signing-files
#   3. Уберите CODE_SIGNING_ALLOWED=NO
