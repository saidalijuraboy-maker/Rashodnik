workflows:
  rashodnik-ios:
    name: Rashodnik iOS
    max_build_duration: 60

    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pnpm-store

    scripts:
      - name: Setup pnpm
        script: |
          corepack enable
          COREPACK_HOME="$HOME/.corepack"
          export COREPACK_HOME
          corepack prepare pnpm@10.26.1 --activate
          export PATH="$COREPACK_HOME/shims:$PATH"
          pnpm --version

      - name: Install dependencies
        script: |
          export PATH="$HOME/.corepack/shims:$PATH"
          cd "$CM_BUILD_DIR"
          pnpm install --frozen-lockfile

      - name: Generate iOS project
        script: |
          export PATH="$HOME/.corepack/shims:$PATH"
          cd "$CM_BUILD_DIR/artifacts/rashodnik"
          pnpm exec expo prebuild --platform ios --no-install
          test -d ios

    artifacts:
      - artifacts/rashodnik/ios/**/*.xcworkspace
      - artifacts/rashodnik/ios/**/*.xcodeproj
